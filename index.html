<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO KE31 PEJOMPONGAN 3</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {--bg1:#ff9a9e; --bg2:#fecfef; --card:#ffffff; --text:#000; --header:#d63384; --border:#f8d7da; --btn:#ff6b9d;}
body.dark {--bg1:#4a1a2e; --bg2:#3e162e; --card:#2e0f30; --text:#fff; --border:#444;}
*{font-family:'Poppins', sans-serif; box-sizing:border-box}
body{background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px; color:var(--text); transition:0.3s}
.box{background:var(--card); padding:25px; border-radius:20px; width:100%; max-width:900px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position:relative}
.btn-setting{position:absolute; top:15px; right:15px; background:var(--header); color:white; border:none; border-radius:50%; width:40px; height:40px; font-size:20px; cursor:pointer; z-index:10; transition:0.3s}
.btn-setting:hover{transform:rotate(90deg)}
h1{color:var(--header); text-align:center; margin:5px 0}
p{text-align:center; margin:5px 0}
button{width:100%; padding:12px; margin:8px 0; border:none; border-radius:10px; font-weight:600; color:white; cursor:pointer; font-size:15px; background:var(--btn); transition:0.2s}
button:hover{opacity:0.85; transform:scale(1.02)}
.btn-ungu{background:#a855f7}.btn-biru{background:#3b82f6}.btn-hijau{background:#10b981}
.btn-abu{background:#6c757d}.btn-merah{background:#e74c3c}
input{width:100%; padding:12px; margin:8px 0; border:2px solid var(--border); border-radius:10px; font-size:14px; background:var(--card); color:var(--text)}
table{width:100%; margin-top:10px; border-collapse:collapse;}
#tabelContainer{overflow-x:auto; -webkit-overflow-scrolling: touch;}
th{background:var(--header); color:white; padding:8px; font-size:12px; white-space:nowrap; min-width:70px}
td{padding:8px; border-bottom:1px solid var(--border); text-align:center; font-size:12px; white-space:nowrap; min-width:70px}
td input{width:60px!important; padding:6px!important; margin:0!important; font-size:13px!important; text-align:center; border:1px solid var(--border)!important; border-radius:8px}
.minus{color:#e74c3c; font-weight:700}.plus{color:#10b981; font-weight:700}
.modal{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:999}
.modal-content{background:var(--card); color:var(--text); padding:20px; border-radius:15px; width:90%; max-width:400px}
#toast{position:fixed; top:-60px; left:50%; transform:translateX(-50%); background:var(--btn); color:#fff; padding:12px 25px; border-radius:20px; transition: top 0.4s; z-index:9999; font-weight:600}
#toast.show{top:20px}
.riwayat-card{background:var(--border); padding:12px; border-radius:10px; margin:8px 0; cursor:pointer}
.page{display:none}.page.active{display:block}
.warna-pilih{display:flex; gap:10px; justify-content:center; margin:10px 0}
.warna-btn{width:40px; height:40px; border-radius:50%; border:3px solid white; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2)}
</style>
</head>
<body>
<div id="toast">✅ Data Tersimpan</div>

<div class="box">
<button class="btn-setting" onclick="gantiMenu('setting')">⚙️</button>

<h1 id="namaToko">SO KE31 PEJOMPONGAN 3</h1>
<p>Alfamart Ke31</p>
<p><b>Created by Feilina 💖</b></p>

<div id="menuUtama" class="page active">
<button onclick="gantiMenu('input')">📝 Input SO</button>
<button onclick="gantiMenu('riwayat')">📚 Riwayat SO</button>
</div>

<div id="pageInput" class="page">
<button class="btn-abu" onclick="gantiMenu('home')">⬅️ Back ke Home</button>
<input type="text" id="inPIC" placeholder="Nama PIC SO: contoh Feilina">
<div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center">
<button onclick="loadItems()">📥 Load 17 Item</button>
<button class="btn-ungu" onclick="bukaModal()">➕ Tambah Manual</button>
<button class="btn-hijau" onclick="exportCSV()">📤 Export Excel</button>
<button class="btn-hijau" onclick="kirimWA()">📲 Kirim WA Minus</button>
<button class="btn-hijau" onclick="simpanPS()">💾 Simpan PS SO</button>
</div>
<div id="tabelContainer"></div>
<div id="totalStok" style="margin-top:15px; font-weight:700; background:var(--header); color:white; padding:15px; border-radius:15px; text-align:center"></div>
</div>

<div id="pageRiwayat" class="page">
<button class="btn-abu" onclick="gantiMenu('home')">⬅️ Back ke Home</button>
<h3>📚 Riwayat Stock Opname</h3>
<button class="btn-merah" onclick="hapusSemuaRiwayat()">🗑️ Hapus Semua Riwayat</button>
<div id="listRiwayat"></div>
</div>

<div id="pageSetting" class="page">
<button class="btn-abu" onclick="gantiMenu('home')">⬅️ Back ke Home</button>
<h3>⚙️ Pengaturan</h3>
<button onclick="toggleDark()">🌙 Dark Mode On/Off</button>
<h4 style="text-align:center; margin:15px 0 5px 0">🎨 Pilih Tema Warna:</h4>
<div class="warna-pilih">
<div class="warna-btn" style="background:#ff6b9d" onclick="gantiTema('pink')"></div>
<div class="warna-btn" style="background:#a855f7" onclick="gantiTema('ungu')"></div>
<div class="warna-btn" style="background:#3b82f6" onclick="gantiTema('biru')"></div>
<div class="warna-btn" style="background:#10b981" onclick="gantiTema('hijau')"></div>
</div>
<button class="btn-ungu" onclick="ubahNamaToko()">🏪 Ubah Nama Toko</button>
<button class="btn-merah" onclick="resetData()">🔄 Reset Semua Data</button>
<p style="font-size:12px; opacity:0.6; margin-top:20px">Versi: v5.4.3 FINAL<br>Dibuat oleh Feilina 💖</p>
</div>
</div>

<div id="modalManual" class="modal">
<div class="modal-content">
<h3>➕ Tambah Produk Manual</h3>
<input type="text" id="inNama" placeholder="Nama Barang">
<input type="number" id="inOH" placeholder="Stok OH">
<input type="number" id="inFisik" placeholder="Stok Fisik">
<input type="number" id="inHarga" placeholder="Harga Satuan">
<button onclick="simpanManual()">Simpan</button>
<button class="btn-merah" onclick="tutupModal()">Batal</button>
</div>
</div>

<script>
let dataBarang = [];
let riwayatSO = JSON.parse(localStorage.getItem('soRiwayat')) || [];
let template17 = [
{n:"Gula Sus"},{n:"Gula PSM"},{n:"Gula GMP"},{n:"Gulaku"},{n:"Gula Rosebrand ijo"},{n:"Gula Rosebrand tebu"},{n:"Gula Alfa lokal"},{n:"Gula Alfa putih"},
{n:"Telor Asin"},{n:"Telur Ayam omega"},{n:"Telur Arab"},{n:"Telur Ayam negri Alfamart"},{n:"Telur Ayam kampung"},{n:"Le min 5L"},{n:"Le min 15L"},{n:"Alfa eco 30x40"},{n:"Alfa eco 38x45"}
];

window.onload = function(){
  let tema = localStorage.getItem('temaSO') || 'pink';
  gantiTema(tema);
  if(localStorage.getItem('darkSO') === 'true'){ document.body.classList.add('dark'); }
}

function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem('darkSO', document.body.classList.contains('dark'));
  showToast("✅ Tema Diganti");
}

function gantiTema(warna){
  let r = document.documentElement.style;
  if(warna=='pink'){ r.setProperty('--bg1','#ff9a9e'); r.setProperty('--bg2','#fecfef'); r.setProperty('--header','#d63384'); r.setProperty('--btn','#ff6b9d'); }
  if(warna=='ungu'){ r.setProperty('--bg1','#c084fc'); r.setProperty('--bg2','#e9d5ff'); r.setProperty('--header','#9333ea'); r.setProperty('--btn','#a855f7'); }
  if(warna=='biru'){ r.setProperty('--bg1','#93c5fd'); r.setProperty('--bg2','#dbeafe'); r.setProperty('--header','#2563eb'); r.setProperty('--btn','#3b82f6'); }
  if(warna=='hijau'){ r.setProperty('--bg1','#6ee7b7'); r.setProperty('--bg2','#d1fae5'); r.setProperty('--header','#059669'); r.setProperty('--btn','#10b981'); }
  localStorage.setItem('temaSO', warna);
  showToast(`✅ Tema ${warna} Aktif`);
}

function ubahNamaToko(){
  let nama = prompt("Masukkan Nama Toko Baru:", document.getElementById('namaToko').innerText);
  if(nama){ document.getElementById('namaToko').innerText = nama; showToast("✅ Nama Toko Diubah"); }
}
function resetData(){
  if(confirm('Yakin reset semua?')){
    dataBarang=[]; riwayatSO=[]; localStorage.clear(); tampilkan(); tampilkanRiwayat(); showToast("✅ Data Direset");
  }
}

function gantiMenu(m){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
if(m=='home') document.getElementById('menuUtama').classList.add('active');
if(m=='input') document.getElementById('pageInput').classList.add('active');
if(m=='riwayat'){ document.getElementById('pageRiwayat').classList.add('active'); tampilkanRiwayat(); }
if(m=='setting') document.getElementById('pageSetting').classList.add('active');
}
function bukaModal(){document.getElementById('modalManual').style.display='flex';}
function tutupModal(){document.getElementById('modalManual').style.display='none';}

function loadItems(){
if(confirm('Load 17 Item Template?')){
dataBarang = [];
template17.forEach(t => dataBarang.push({nama:t.n, oh:0, fisik:0, harga:0}));
tampilkan(); showToast("✅ 17 Item Dimuat");
}}
function simpanManual(){
let n = document.getElementById('inNama').value;
let oh = document.getElementById('inOH').value;
let f = document.getElementById('inFisik').value;
let h = document.getElementById('inHarga').value;
if(!n){alert('Isi Nama Barang!'); return;}
dataBarang.push({nama:n, oh:Number(oh)||0, fisik:Number(f)||0, harga:Number(h)||0});
tutupModal(); tampilkan(); showToast("✅ Produk Ditambah");
}

function updateField(i, f, v){ dataBarang[i][f] = Number(v)||0; tampilkan(); }

function tampilkan(){
let html = '<table><tr><th>No</th><th>Nama Barang</th><th>OH</th><th>Fisik</th><th>Harga</th><th>Selisih</th><th>Selisih Rp</th><th>Aksi</th></tr>';
let tOH=0, tF=0, tRp=0;
dataBarang.forEach((item,i)=>{
tOH += item.oh; tF += item.fisik;
let s = item.fisik - item.oh;
let sRp = s * (item.harga || 0);
tRp += sRp;
let c = s>0?'plus':s<0?'minus':'';
html += `<tr><td>${i+1}</td><td style="text-align:left">${item.nama}</td>
<td><input type="number" inputmode="numeric" value="${item.oh}" oninput="updateField(${i},'oh',this.value)"></td>
<td><input type="number" inputmode="numeric" value="${item.fisik}" oninput="updateField(${i},'fisik',this.value)"></td>
<td><input type="number" inputmode="numeric" value="${item.harga}" oninput="updateField(${i},'harga',this.value)"></td>
<td class="${c}">${s}</td>
<td class="${c}">Rp ${sRp.toLocaleString('id-ID')}</td>
<td><button class="btn-merah" onclick="hapus(${i})" style="padding:8px; width:auto">🗑️</button></td></tr>`;
});
html += '</table>';
document.getElementById('tabelContainer').innerHTML = html;
document.getElementById('totalStok').innerHTML = `Total Item: ${dataBarang.length} | Total OH: ${tOH} | Total Fisik: ${tF} | Total Selisih Rp: Rp ${tRp.toLocaleString('id-ID')}`;
}
function hapus(i){ if(confirm('Hapus produk ini?')){ dataBarang.splice(i,1); tampilkan(); } }

function simpanPS(){
let pic = document.getElementById('inPIC').value;
if(!pic){alert('Isi Nama PIC dulu!'); return;}
if(dataBarang.length==0){alert('Load 17 Item dulu!'); return;}
let tgl = new Date().toLocaleDateString('id-ID') + ' + new Date().toLocaleTimeString('id-ID'); // FIX TYPO
riwayatSO.unshift({tanggal:tgl, pic:pic, data:JSON.parse(JSON.stringify(dataBarang))});
localStorage.setItem('soRiwayat', JSON.stringify(riwayatSO));
showToast(`✅ Data Tersimpan ${tgl}`);
gantiMenu('home');
}

function tampilkanRiwayat(){
let html = '';
riwayatSO.forEach((r,i)=>{
html += `<div class="riwayat-card" onclick="lihat(${i})">
<b>${r.tanggal}</b><br>PIC: <b>${r.pic}</b><br>Total Item: ${r.data.length}<br>
<button class="btn-merah" onclick="event.stopPropagation(); hapusR(${i})">🗑️ Hapus</button>
</div>`;
});
document.getElementById('listRiwayat').innerHTML = html || '<p>Belum ada riwayat SO</p>';
}
function lihat(i){ dataBarang = JSON.parse(JSON.stringify(riwayatSO[i].data)); gantiMenu('input'); tampilkan(); showToast(`📄 Buka data ${riwayatSO[i].tanggal}`); }
function hapusR(i){ if(confirm('Hapus riwayat ini?')){ riwayatSO.splice(i,1); localStorage.setItem('soRiwayat', JSON.stringify(riwayatSO)); tampilkanRiwayat(); } }
function hapusSemuaRiwayat(){ if(confirm('Yakin hapus SEMUA riwayat?')){ riwayatSO=[]; localStorage.removeItem('soRiwayat'); tampilkanRiwayat(); showToast("✅ Riwayat Dihapus"); } }

function exportCSV(){
if(dataBarang.length==0){alert('Data kosong!'); return;}
let csv = 'No,Nama Barang,OH,Fisik,Harga,Selisih,Selisih Rp\n';
dataBarang.forEach((d,i)=>{
let s = d.fisik-d.oh; let sRp = s * d.harga;
csv += `${i+1},"${d.nama}",${d.oh},${d.fisik},${d.harga},${s},${sRp}\n`
});
let blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `SO-KE31-${new Date().toISOString().split('T')[0]}.csv`; a.click();
showToast("✅ Export Excel Berhasil");
}

function kirimWA(){
let pic = document.getElementById('inPIC').value;
if(!pic){alert('Isi Nama PIC dulu!'); return;}
let pesan = `*REKAP MINUS SO KE31*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\nPIC: ${pic}\n\n`;
let ada = false;
dataBarang.forEach(d=>{ let s = d.fisik - d.oh; if(s<0){ pesan += `- ${d.nama}: ${s} pcs x Rp${d.harga.toLocaleString('id-ID')} = Rp${(s*d.harga).toLocaleString('id-ID')}\n`; ada=true; }});
if(!ada) pesan += "Alhamdulillah Tidak ada minus 🙏\n\n*Semua stok aman*";
window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`);
}

function showToast(p){ const t=document.getElementById('toast'); t.innerText=p; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); } // FIX
</script>
</body>
</html>
